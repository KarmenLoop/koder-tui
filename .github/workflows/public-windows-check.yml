name: Public Windows installer check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-install:
    runs-on: windows-latest
    steps:
      - name: Download and install from the public website
        shell: powershell
        env:
          KODER_TUI_EULA_ACCEPT: '1'
          KODER_AUTO_UPDATE: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $env:KODER_TUI_HOME = Join-Path $env:RUNNER_TEMP 'public-tui'
          $env:KODER_CLI_HOME = Join-Path $env:RUNNER_TEMP 'isolated-profile'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'koder-tui-install.cmd'
          Invoke-WebRequest -UseBasicParsing 'https://karmenloop.com/install/tui-0.3.0/koder-tui.cmd' -OutFile $bootstrap -TimeoutSec 90
          & $bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Public bootstrap failed.' }
          & (Join-Path $env:KODER_TUI_HOME 'bin/koder-tui.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed.' }
          Write-Host 'PUBLIC_WINDOWS_POWERSHELL_5_INSTALL_PASS'
